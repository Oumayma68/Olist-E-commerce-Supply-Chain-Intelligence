version: 2

models:
  - name: fct_order_items
    description: "Fact table with one row per item in an order."

    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: order_item_id
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
