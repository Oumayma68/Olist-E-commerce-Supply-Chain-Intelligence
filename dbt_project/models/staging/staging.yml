version: 2

models:
  - name: stg_orders
    description: "Cleaned order data from the raw Olist source."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique

  - name: stg_order_items
    description: "Cleaned order item data from the raw Olist source."
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: order_item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: seller_id
        data_tests:
          - not_null

      - name: price
        description: "Item price excluding freight."
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true

      - name: freight_value
        description: "Freight cost associated with the item."
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id

  - name: stg_payments
    description: "Cleaned payment data from the raw Olist source."
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: payment_sequential
        data_tests:
          - not_null

      - name: payment_type
        data_tests:
          - not_null

      - name: payment_value
        description: "Payment amount recorded for the order."
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential


  - name: stg_customers
    description: "Cleaned customer data from the raw Olist source."
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        data_tests:
          - not_null


  - name: stg_products
    description: "Cleaned product data from the raw Olist source."
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique


  - name: stg_sellers
    description: "Cleaned seller data from the raw Olist source."
    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique