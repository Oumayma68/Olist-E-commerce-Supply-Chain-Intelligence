name: Olist Analytics CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: olist
          POSTGRES_USER: olist_user
          POSTGRES_PASSWORD: olist_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olist_user -d olist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-core==1.12.5 dbt-postgres==1.11.0 kaggle

      - name: Download Olist dataset from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p data
          kaggle datasets download olistbr/brazilian-ecommerce \
            --path data \
            --unzip

      - name: Verify required CSV files
        run: |
          for file in \
            olist_customers_dataset.csv \
            olist_orders_dataset.csv \
            olist_order_items_dataset.csv \
            olist_order_payments_dataset.csv \
            olist_products_dataset.csv \
            olist_sellers_dataset.csv
          do
            test -f "data/$file" || {
              echo "Missing file: $file"
              exit 1
            }
          done

          echo "All required CSV files are present."

      - name: Initialize PostgreSQL schemas and tables
        env:
          PGPASSWORD: olist_password
        run: |
          psql -h localhost -U olist_user -d olist \
            -v ON_ERROR_STOP=1 \
            -f database/init/01_create_schema.sql

          psql -h localhost -U olist_user -d olist \
            -v ON_ERROR_STOP=1 \
            -f database/sql/01_create_raw_tables.sql

      - name: Load raw Olist data
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: olist
          POSTGRES_USER: olist_user
          POSTGRES_PASSWORD: olist_password
        run: |
          python -m compileall -q scripts
          python scripts/load_raw.py

      - name: Configure dbt profile
        run: |
          mkdir -p "$HOME/.dbt"

          cat > "$HOME/.dbt/profiles.yml" <<'EOF'
          dbt_project:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                user: olist_user
                password: olist_password
                port: 5432
                dbname: olist
                schema: analytics
                threads: 4
          EOF

      - name: Install dbt packages
        working-directory: dbt_project
        run: dbt deps

      - name: Validate dbt project
        working-directory: dbt_project
        run: dbt debug

      - name: Parse dbt project
        working-directory: dbt_project
        run: dbt parse

      - name: Run dbt snapshots
        working-directory: dbt_project
        run: dbt snapshot

      - name: Build dbt models and tests
        working-directory: dbt_project
        run: dbt build --exclude resource_type:snapshot
